services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SENTINELRAG_ENV: dev
      SENTINELRAG_QDRANT_URL: http://qdrant:6333
      SENTINELRAG_LLM_PROVIDER: mock
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
