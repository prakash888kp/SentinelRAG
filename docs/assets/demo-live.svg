<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">SentinelRAG live demo recording</title>
  <desc id="d">Animated terminal capture of gate + 60s Gemini demo with citations</desc>
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <clipPath id="screen"><rect x="24" y="56" width="912" height="460" rx="8"/></clipPath>
  </defs>
  <rect width="960" height="540" rx="18" fill="#1e293b"/>
  <rect x="12" y="12" width="936" height="516" rx="14" fill="url(#termBg)" stroke="#334155"/>
  <circle cx="40" cy="34" r="7" fill="#ef4444"/>
  <circle cx="64" cy="34" r="7" fill="#f59e0b"/>
  <circle cx="88" cy="34" r="7" fill="#22c55e"/>
  <text x="480" y="38" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="ui-monospace, Consolas, monospace">sentinelrag  live demo · ~6s warm</text>
  <g clip-path="url(#screen)" font-family="ui-monospace, Consolas, monospace" font-size="15">
    <g id="lines" fill="#e2e8f0">
      <text x="40" y="90" fill="#2dd4bf">$ uv run sentinelrag-gate run --refresh</text>
      <text x="40" y="118" class="l" opacity="0">Gate passed · evidence.json · junit.xml · sarif.json</text>
      <text x="40" y="146" class="l" opacity="0" fill="#86efac"> hybrid recall@5 = 1.0 · faithfulness = 0.83 · poison probes blocked</text>
      <text x="40" y="182" class="l" opacity="0" fill="#2dd4bf">$ uv run python scripts/demo_60s.py</text>
      <text x="40" y="210" class="l" opacity="0">=== SentinelRAG 60s demo ===</text>
      <text x="40" y="238" class="l" opacity="0">1) health: ok · llm=gemini/gemini-2.5-flash</text>
      <text x="40" y="266" class="l" opacity="0">   embed=BAAI/bge-small-en-v1.5 · rerank=ms-marco-MiniLM-L-6-v2</text>
      <text x="40" y="294" class="l" opacity="0">2) index ready  skip ingest</text>
      <text x="40" y="322" class="l" opacity="0">3) query strategy=auto &</text>
      <text x="40" y="350" class="l" opacity="0" fill="#93c5fd">   answer: Ingest-time poison probes + eval-gate YAML fail CI on regressions.</text>
      <text x="40" y="378" class="l" opacity="0">   strategy=agentic · provider=gemini · citations=5</text>
      <text x="40" y="406" class="l" opacity="0" fill="#94a3b8">     - pc-01-triple-gate · pc-12-poison-meta · pc-13-lexical-defense</text>
      <text x="40" y="442" class="l" opacity="0" fill="#fbbf24">Done in 5.7s</text>
      <text x="40" y="478" class="l" opacity="0" fill="#2dd4bf">$ ˆ</text>
    </g>
  </g>
  <style><![CDATA[
    .l { opacity: 0; }
    @keyframes reveal {
      0% { opacity: 0; }
      8% { opacity: 1; }
      92% { opacity: 1; }
      100% { opacity: 0.15; }
    }
    .l:nth-child(2) { animation: reveal 12s ease infinite; animation-delay: 0.6s; }
    .l:nth-child(3) { animation: reveal 12s ease infinite; animation-delay: 1.2s; }
    .l:nth-child(4) { animation: reveal 12s ease infinite; animation-delay: 2.0s; }
    .l:nth-child(5) { animation: reveal 12s ease infinite; animation-delay: 2.6s; }
    .l:nth-child(6) { animation: reveal 12s ease infinite; animation-delay: 3.2s; }
    .l:nth-child(7) { animation: reveal 12s ease infinite; animation-delay: 3.8s; }
    .l:nth-child(8) { animation: reveal 12s ease infinite; animation-delay: 4.2s; }
    .l:nth-child(9) { animation: reveal 12s ease infinite; animation-delay: 4.8s; }
    .l:nth-child(10) { animation: reveal 12s ease infinite; animation-delay: 5.6s; }
    .l:nth-child(11) { animation: reveal 12s ease infinite; animation-delay: 6.4s; }
    .l:nth-child(12) { animation: reveal 12s ease infinite; animation-delay: 7.0s; }
    .l:nth-child(13) { animation: reveal 12s ease infinite; animation-delay: 7.8s; }
    .l:nth-child(14) { animation: reveal 12s ease infinite; animation-delay: 8.6s; }
  ]]></style>
</svg>
