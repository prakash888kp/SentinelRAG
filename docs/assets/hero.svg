<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">SentinelRAG</title>
  <desc id="desc">Hero banner: triple-gate RAG supply-chain CI  Retrieve, Ground, Defend</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#12233a"/>
      <stop offset="100%" stop-color="#0e1a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="120" fill="#2dd4bf" opacity="0.06"/>
  <circle cx="1180" cy="320" r="160" fill="#f59e0b" opacity="0.05"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="150" fill="#f8fafc" font-size="64" font-weight="700">SentinelRAG</text>
    <text x="72" y="198" fill="#94a3b8" font-size="22">RAG supply-chain CI  retrieval · grounding · poison defenses</text>
    <rect x="72" y="230" width="220" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="280" fill="#cbd5e1" font-size="16">evidence.json · JUnit · SARIF · offline by default</text>
  </g>
  <g transform="translate(760,90)" filter="url(#glow)">
    <rect x="0" y="40" width="140" height="72" rx="14" fill="#132337" stroke="#2dd4bf" stroke-width="2"/>
    <text x="70" y="82" text-anchor="middle" fill="#e2e8f0" font-size="18" font-family="Segoe UI, Arial, sans-serif">Retrieve</text>
    <rect x="180" y="40" width="140" height="72" rx="14" fill="#132337" stroke="#38bdf8" stroke-width="2"/>
    <text x="250" y="82" text-anchor="middle" fill="#e2e8f0" font-size="18" font-family="Segoe UI, Arial, sans-serif">Ground</text>
    <rect x="360" y="40" width="140" height="72" rx="14" fill="#132337" stroke="#f59e0b" stroke-width="2"/>
    <text x="430" y="82" text-anchor="middle" fill="#e2e8f0" font-size="18" font-family="Segoe UI, Arial, sans-serif">Defend</text>
    <path d="M140 76 H180" stroke="#64748b" stroke-width="3"/>
    <path d="M320 76 H360" stroke="#64748b" stroke-width="3"/>
    <path d="M250 112 V160 H250" stroke="#64748b" stroke-width="3"/>
    <circle cx="250" cy="190" r="36" fill="#0f172a" stroke="#2dd4bf" stroke-width="3"/>
    <text x="250" y="196" text-anchor="middle" fill="#2dd4bf" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">GATE</text>
  </g>
</svg>
