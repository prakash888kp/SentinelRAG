name: codeql

# Private repos without GitHub Advanced Security cannot upload to Code Scanning.
# We still run analysis and keep SARIF as an artifact so CI stays green.

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL analysis
        id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
        with:
          # Private repos without Advanced Security cannot upload to code scanning.
          upload: never
      - name: Upload SARIF artifact (best-effort)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-python-sarif
          path: |
            **/results/**/*.sarif
            **/*.sarif
          if-no-files-found: ignore
