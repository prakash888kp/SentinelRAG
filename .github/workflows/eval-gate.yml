name: eval-gate

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

jobs:
  phase1-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run python benchmarks/run_phase1_retrieval.py
      - run: uv run python benchmarks/run_phase2_eval.py
      - run: uv run python scripts/check_eval_gate.py
