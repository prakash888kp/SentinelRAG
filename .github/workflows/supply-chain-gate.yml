name: supply-chain-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - name: Fixture-bound gate
        env:
          SENTINELRAG_APP_REVISION: ${{ github.sha }}
        run: uv run sentinelrag-gate run --refresh --binding-mode fixture
      - name: App-bound chunk-size regression
        env:
          SENTINELRAG_APP_REVISION: ${{ github.sha }}
        run: |
          uv run sentinelrag-gate app-bound-check \
            --baseline-chunk-size 500 \
            --harmful-chunk-size 64 \
            --out .sentinelrag/app-bound
      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinelrag-gate
          path: |
            .sentinelrag/gate/
            .sentinelrag/app-bound/
