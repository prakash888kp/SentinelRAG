name: redteam-gate

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run python benchmarks/run_redteam_sweep.py
      - run: uv run python scripts/check_redteam_gate.py
