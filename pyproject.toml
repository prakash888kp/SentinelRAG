[project]
name = "sentinelrag"
version = "0.1.0"
description = "Triple-gate adaptive RAG: CI gates for retrieval, answer quality, and ingest poison defenses"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "PRAKASH KUMAR K", email = "prakash888kp@users.noreply.github.com" }]
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "evaluation",
  "ci",
  "red-team",
  "security",
  "qdrant",
  "fastapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "qdrant-client>=1.12.0",
  "rank-bm25>=0.2.2",
  "numpy>=2.1.0",
  "pyyaml>=6.0.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
]

[project.urls]
Homepage = "https://github.com/prakash888kp/SentinelRAG"
Repository = "https://github.com/prakash888kp/SentinelRAG"
Issues = "https://github.com/prakash888kp/SentinelRAG/issues"
Documentation = "https://github.com/prakash888kp/SentinelRAG#readme"
Changelog = "https://github.com/prakash888kp/SentinelRAG/blob/master/CHANGELOG.md"

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.3.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-requests>=2.32.0",
  "matplotlib>=3.9.0",
]

[project.scripts]
sentinelrag = "sentinelrag.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelrag"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["sentinelrag"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["rank_bm25", "sentence_transformers", "sentence_transformers.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=sentinelrag --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/sentinelrag"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
